
# TrustLens AI — Python package configuration
# PyPI publication preparation

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-ai"
dynamic = ["version"]
description = "Open-source AI data readiness, governance and trust assessment framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Korede Adeyanju"}
]

keywords = [
    "artificial-intelligence",
    "data-quality",
    "data-governance",
    "ai-readiness",
    "responsible-ai",
    "fairness",
    "data-drift",
    "trustworthy-ai"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent"
]

dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0"
]

[project.urls]
Homepage = "https://github.com/deyanjukorede/trustlens-ai"
Repository = "https://github.com/deyanjukorede/trustlens-ai"
Documentation = "https://github.com/deyanjukorede/trustlens-ai#readme"
Issues = "https://github.com/deyanjukorede/trustlens-ai/issues"
Changelog = "https://github.com/deyanjukorede/trustlens-ai/blob/main/CHANGELOG.md"
Releases = "https://github.com/deyanjukorede/trustlens-ai/releases"

[project.scripts]
trustlens = "trustlens.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["trustlens*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "trustlens.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
