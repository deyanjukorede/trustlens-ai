
name: Publish TrustLens AI to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine packaging

      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version
          import trustlens

          expected = Version(os.environ["RELEASE_TAG"].removeprefix("v"))
          actual = Version(trustlens.__version__)

          if actual != expected:
              raise SystemExit(
                  f"Version mismatch: tag={expected}, package={actual}"
              )

          print(f"Validated release version: {actual}")
          PY

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: trustlens-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/trustlens-ai/

    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: trustlens-python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
